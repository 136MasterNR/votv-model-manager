[package]
name = "votv-model-manager"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "VotV Model Manager: browse printer models with generated icons and a 3D preview"

[dependencies]
# Pinned on purpose: Bevy's UI, mesh and input APIs change between releases.
bevy = { version = "=0.16.1", default-features = false, features = [
    "std", "async_executor", "multi_threaded",
    "bevy_asset", "bevy_color", "bevy_core_pipeline", "bevy_gizmos", "bevy_log",
    "bevy_pbr", "bevy_render", "bevy_window", "bevy_winit",
    "bevy_ui", "bevy_text", "default_font", "bevy_picking", "bevy_ui_picking_backend",
    "png", "tonemapping_luts", "x11", "wayland",
] }
tobj = "4"
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "5"    # Windows known-folder lookup for %LocalAppData%
rfd = "0.15"   # native folder picker (Windows: no extra dependencies)
# The converter (synced copy of the converter agent's workspace; see converter/INTEGRATION.md). No Bevy inside.
# Do NOT add a [workspace] table to this manifest: converter/ is its own workspace.
serde_json = "1"   # reads votv_convert.json (the options a model was converted with) for the Edit button
votv-convert = { path = "converter/crates/votv-convert" }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }   # export / import of .zip (src/export.rs, src/import.rs); no C codecs. 9.0.5 fixes the dual-header (Zip Cloaking) advisory
# Import of .7z and .rar (src/import.rs). Both only READ: the importer writes every file itself, after checking its path.
# sevenz-rust2: pure Rust, decoding only (LZMA / LZMA2 / BZip2 / PPMd / Deflate, no passwords). >= 0.21.1 is required: older
# versions have a path-traversal bug (CVE-2026-61725) in their `decompress*` helpers, which we do not use either. Needs Rust 1.93.
sevenz-rust2 = { version = "0.24.1", default-features = false, features = ["bzip2", "ppmd", "deflate"] }
# unrar: rarlab's UnRAR C++ source (7.1), compiled by build.rs with the C++ compiler that Rust on Windows already needs.
# Its licence (see THIRD-PARTY-NOTICES.md) allows use in any software that only unpacks RAR files.
unrar = "0.5.8"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "fat"          # was "thin"; better dead-code removal
codegen-units = 1    # slower build, smaller and faster binary
panic = "abort"      # drops unwinding tables
strip = true         # removes symbols and debug info
opt-level = 3        # speed over size: measured 25-30 % faster preview loads than "s" (the exe is larger; accepted)

[build-dependencies]
# Embeds assets/icon.ico in the Windows exe (Explorer, taskbar, shortcuts); see build.rs.
winresource = "0.1"
