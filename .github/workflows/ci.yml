name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Deliberately as relaxed as `cargo build --release` on a developer machine: no format check and no Clippy.
      # The build is the gate; the tests are reported but do not fail the run.
      - name: Build
        run: cargo build --release --verbose

      - name: Test
        run: cargo test --verbose
        continue-on-error: true

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ matrix.os }}
          path: |
            target/release/${{ github.event.repository.name }}
            target/release/${{ github.event.repository.name }}.exe
          if-no-files-found: ignore