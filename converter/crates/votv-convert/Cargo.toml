[package]
name = "votv-convert"
description = "Converts .glb models into VotV (Voices of the Void) printer folders"
version = "0.2.0"
edition = "2021"
license = "MIT"

[lib]
name = "votv_convert"
path = "src/lib.rs"

[[bin]]
name = "votv-convert"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = []
# Developer command line front end (`cargo run -p votv-convert --features cli -- model.glb`). Not built by default.
cli = ["dep:clap"]

[dependencies]
votv-model-core = { path = "../votv-model-core" }
gltf = { version = "1.4.1", default-features = false, features = ["import", "utils", "names", "extensions", "KHR_texture_transform", "KHR_materials_pbrSpecularGlossiness"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
parry3d = "0.31"
# Not used directly: enables png's pure-Rust zlib-rs deflate backend for the encoder that `image` uses (features are unified), much faster than the default.
png = { version = "0.18", default-features = false, features = ["zlib-rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"], optional = true }

[dev-dependencies]
# the Model Manager loads OBJs with tobj 4; tests make sure our output loads there
tobj = "4"
